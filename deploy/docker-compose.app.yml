services:
  noiou-alpha-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: noiou-alpha-app:local
    container_name: noiou-alpha-app
    restart: unless-stopped
    networks:
      - noiou-alpha-net
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

networks:
  noiou-alpha-net:
    external: true
